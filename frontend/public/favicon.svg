<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="forgeGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b1a"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0d0d0f"/>
  <rect width="32" height="32" rx="6" fill="url(#forgeGradient)" opacity="0.1"/>
  <g filter="url(#glow)">
    <path d="M16 4 L16 18" stroke="url(#forgeGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10 18 L16 26 L22 18" stroke="url(#forgeGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="16" cy="18" r="5" fill="none" stroke="url(#forgeGradient)" stroke-width="2"/>
  </g>
</svg>