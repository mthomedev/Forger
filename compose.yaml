services:
  mysql:
    container_name: forger-mysql
    networks:
      - forger-network
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: forger
      MYSQL_USER: forger
      MYSQL_PASSWORD: forger
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    container_name: forger-backend
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - forger-network
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  forger-network:
